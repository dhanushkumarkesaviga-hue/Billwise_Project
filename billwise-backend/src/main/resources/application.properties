# ==== Server ====
server.port=8081

# ==== MongoDB ====
# Local dev default. Override with a full Atlas/replica-set URI via the
# MONGODB_URI env var in production, e.g.:
#   mongodb+srv://user:pass@cluster0.mongodb.net/billwise_db
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/billwise_db}

# ==== JWT ====
# Set JWT_SECRET as a real environment variable in production (must be a
# long, random Base64-safe string, at least 256 bits for HS256).
jwt.secret=${JWT_SECRET:billwise-dev-only-secret-key-change-me-in-production-1234567890}
# Access token validity in milliseconds (default: 24h)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==== Gemini API ====
# Get a free-tier key at https://aistudio.google.com/app/apikey
# Set it as a real environment variable, don't hardcode it here:
#   export GEMINI_API_KEY=your_key_here          (Linux/Mac)
#   setx GEMINI_API_KEY "your_key_here"           (Windows)
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.model=gemini-flash-latest

# ==== Mail (SMTP) ====
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:freefiregodtamil@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:onsdetdhylfaxaoi}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==== ML Category Classifier Microservice ====
ml.classify.url=${ML_CLASSIFY_URL:http://localhost:8000/classify}
ml.classify.timeout-ms=3000

# ==== Logging ====
logging.level.com.billwise.backend=INFO

