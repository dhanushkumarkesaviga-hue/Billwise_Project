server:
  port: 8083

spring:
  application:
    name: invoice-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/billwise

eureka:
  instance:
    prefer-ip-address: true
    leaseRenewalIntervalInSeconds: 3
    leaseExpirationDurationInSeconds: 10
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

billwise:
  jwt:
    secret: billwise-super-secret-jwt-signing-key-for-gst-saas-2026-production-grade
    expiration-ms: 86400000

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3:latest}
  vision-model: ${OLLAMA_VISION_MODEL:llama3.2-vision:latest}
  vision-timeout-seconds: ${OLLAMA_VISION_TIMEOUT:120}
  timeout-seconds: 120

ml:
  classify:
    url: ${ML_CLASSIFY_URL:http://localhost:8000/classify}
    timeout-ms: 3000

